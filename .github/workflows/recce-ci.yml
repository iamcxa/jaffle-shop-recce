name: Recce CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  recce-ci:
    runs-on: ubuntu-latest
    name: Recce Data Validation
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install uv
        run: python3 -m pip install uv
      
      - name: Install dependencies
        run: uv pip install recce dbt-core --system
      
      - name: Run Recce CI
        run: |
          recce ci --profile-template default
      
      - name: Comment on PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const recceReportPath = '.recce/recce_ci.html';
            
            if (fs.existsSync(recceReportPath)) {
              const report = fs.readFileSync(recceReportPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ **Recce Data Validation Report**\n\nData changes have been validated. [View detailed report](./recce_ci.html)'
              });
            }
